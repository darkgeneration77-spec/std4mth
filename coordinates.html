<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四年级数学｜坐标互动学习</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",sans-serif;background:#07111d;color:#eefaff}header{position:sticky;top:0;z-index:9;padding:14px 5vw;background:#0b1723ee;border-bottom:1px solid #ffffff18;display:flex;justify-content:space-between;align-items:center}button,a.btn{padding:10px 14px;border:1px solid #ffffff25;border-radius:12px;background:#13283a;color:#fff;text-decoration:none;cursor:pointer}.wrap{width:min(1050px,94vw);margin:auto;padding:24px 0}.panel{margin:18px 0;padding:22px;border:1px solid #ffffff18;border-radius:22px;background:#0b1b2a}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.board{background:#f8fbff;border-radius:16px;padding:10px}.board svg{width:100%;display:block}.card{padding:15px;border-radius:14px;background:#ffffff0a;border:1px solid #ffffff12;margin-bottom:10px}.big{font-size:28px;font-weight:900}.muted{color:#9fb3c2}.controls{display:flex;gap:8px;flex-wrap:wrap}.status{padding:14px;border-radius:12px;background:#101f2e;margin:12px 0;min-height:52px}.page{display:none}.page.active{display:block}.quizOpt{display:block;width:100%;text-align:left;margin:8px 0}.bar{height:10px;background:#ffffff12;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#67e9ff;width:0}.result{font-size:20px;font-weight:800}@media(max-width:760px){.grid{grid-template-columns:1fr}header{gap:8px;flex-wrap:wrap}}</style></head><body><header><b>第七单元｜坐标</b><div><a class="btn" href="index.html">返回学习中心</a> <button onclick="replay()">重播</button></div></header><main class="wrap"><section class="page active" id="p1"><div class="panel"><h1>Page 1/3｜认识坐标</h1><p class="muted">坐标用来表示一个位置。坐标写成（x，y）。</p><div class="grid"><div class="board"><svg viewBox="0 0 500 500"><g stroke="#d8e4ef"> <path d="M50 50V450M100 50V450M150 50V450M200 50V450M250 50V450M300 50V450M350 50V450M400 50V450M450 50V450M50 450H450M50 400H450M50 350H450M50 300H450M50 250H450M50 200H450M50 150H450M50 100H450M50 50H450"/></g><path d="M50 450H465M50 450V35" stroke="#111" stroke-width="4"/><text x="465" y="440" fill="#111" font-size="24">x</text><text x="60" y="40" fill="#111" font-size="24">y</text><circle cx="50" cy="450" r="8" fill="#e91e63"/><text x="60" y="478" fill="#111" font-size="18">O(0,0)</text><polyline id="route1" points="50,450 200,450 200,350" fill="none" stroke="#e91e63" stroke-width="7" stroke-dasharray="250" stroke-dashoffset="250"/><circle id="dot1" cx="50" cy="450" r="11" fill="#e91e63"/><text id="lab1" x="215" y="340" fill="#111" font-size="22" font-weight="700" opacity="0">A(3,2)</text></svg></div><div><div class="card big">（x，y）</div><div class="card">x轴：横向<br>y轴：纵向<br>原点：O（0，0）</div><div class="card big">先横后竖<br>先 x 后 y</div><div id="s1" class="status">点击播放。</div><button onclick="play1()">播放动画</button></div></div></div><div class="controls"><button disabled>上一页</button><button onclick="go(2)">下一页</button></div></section><section class="page" id="p2"><div class="panel"><h1>Page 2/3｜找出坐标</h1><p class="muted">看到一个点，先找横向的 x，再找纵向的 y。</p><div class="grid"><div class="board"><svg viewBox="0 0 500 500"><g stroke="#d8e4ef"><path d="M50 60V445M105 60V445M160 60V445M215 60V445M270 60V445M325 60V445M380 60V445M435 60V445M50 445H435M50 390H435M50 335H435M50 280H435M50 225H435M50 170H435M50 115H435M50 60H435"/></g><path d="M50 445H450M50 445V45" stroke="#111" stroke-width="4"/><g id="helper"></g><g fill="#e91e63" font-size="19" font-weight="700"><circle cx="270" cy="280" r="9"/><text x="282" y="272" fill="#111">A</text><circle cx="160" cy="170" r="9"/><text x="172" y="162" fill="#111">B</text><circle cx="380" cy="390" r="9"/><text x="392" y="382" fill="#111">C</text><circle cx="105" cy="335" r="9"/><text x="117" y="327" fill="#111">D</text></g></svg></div><div><div class="card big">找坐标：先 x，再 y</div><div class="controls"><button onclick="findP('A',4,3,270,280)">A</button><button onclick="findP('B',2,5,160,170)">B</button><button onclick="findP('C',6,1,380,390)">C</button><button onclick="findP('D',1,2,105,335)">D</button></div><div id="s2" class="status">点击一个点。</div></div></div></div><div class="controls"><button onclick="go(1)">上一页</button><button onclick="go(3)">下一页</button></div></section><section class="page" id="p3"><div class="panel"><h1>Page 3/3｜标示坐标</h1><p class="muted">看到（x，y），先找 x，再找 y，最后标出点。</p><div class="grid"><div class="board"><svg viewBox="0 0 500 500"><g stroke="#d8e4ef"><path d="M50 60V445M105 60V445M160 60V445M215 60V445M270 60V445M325 60V445M380 60V445M435 60V445M50 445H435M50 390H435M50 335H435M50 280H435M50 225H435M50 170H435M50 115H435M50 60H435"/></g><path d="M50 445H450M50 445V45" stroke="#111" stroke-width="4"/><polyline id="route3" points="50,445 270,445 270,280" fill="none" stroke="#e91e63" stroke-width="7" stroke-dasharray="385" stroke-dashoffset="385"/><circle id="dot3" cx="50" cy="445" r="11" fill="#e91e63"/><text id="lab3" x="282" y="270" fill="#111" font-size="22" font-weight="700" opacity="0">A(4,3)</text></svg></div><div><div class="card big">A（4，3）</div><div class="card">第一步：x = 4<br>第二步：y = 3<br>最后标出 A</div><div id="s3" class="status">准备标示。</div><button onclick="play3()">播放动画</button></div></div></div><div class="controls"><button onclick="go(2)">上一页</button><button onclick="document.getElementById('mastery').scrollIntoView({behavior:'smooth'})">进入掌握检测</button></div></section><section id="mastery" class="panel"><h1>坐标掌握检测｜10题</h1><p class="muted">检查：认识坐标、找出坐标、标示坐标。90%以上为已掌握。</p><div id="start"><button onclick="startQuiz()">开始检测</button></div><div id="qa" style="display:none"><b id="prog"></b><div class="bar"><i id="bar"></i></div><div id="qbox" class="card" style="margin-top:14px"></div><div id="feed" class="status"></div></div><div id="res"></div></section></main><script>let cur=1,t=[];function later(f,m){t.push(setTimeout(f,m))}function go(n){t.forEach(clearTimeout);t=[];document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('p'+n).classList.add('active');cur=n;scrollTo({top:0,behavior:'smooth'})}function replay(){cur==1?play1():cur==3?play3():s2.textContent='点击 A、B、C 或 D。'}function play1(){route1.style.transition='none';route1.style.strokeDashoffset=250;dot1.style.transition='none';dot1.setAttribute('cx',50);dot1.setAttribute('cy',450);lab1.setAttribute('opacity',0);s1.textContent='先看 x：横向走 3 格。';later(()=>{route1.style.transition='stroke-dashoffset 2.2s';route1.style.strokeDashoffset=0;dot1.style.transition='cx 1.1s linear,cy 1.1s linear 1.1s';dot1.setAttribute('cx',200);dot1.setAttribute('cy',350)},300);later(()=>{lab1.setAttribute('opacity',1);s1.textContent='再看 y：向上走 2 格。所以是 A（3，2）。'},2600)}function findP(n,x,y,cx,cy){helper.innerHTML='';s2.textContent=`${n}：先找 x = ${x}`;let ns='http://www.w3.org/2000/svg',v=document.createElementNS(ns,'line');Object.entries({x1:cx,y1:445,x2:cx,y2:cy,stroke:'#e91e63','stroke-width':5,'stroke-dasharray':'10 7'}).forEach(([a,b])=>v.setAttribute(a,b));helper.append(v);later(()=>{let h=document.createElementNS(ns,'line');Object.entries({x1:50,y1:cy,x2:cx,y2:cy,stroke:'#673ab7','stroke-width':5,'stroke-dasharray':'10 7'}).forEach(([a,b])=>h.setAttribute(a,b));helper.append(h);s2.textContent=`再找 y = ${y}`},700);later(()=>s2.textContent=`${n} 的坐标是（${x}，${y}）`,1500)}function play3(){route3.style.transition='none';route3.style.strokeDashoffset=385;dot3.style.transition='none';dot3.setAttribute('cx',50);dot3.setAttribute('cy',445);lab3.setAttribute('opacity',0);s3.textContent='先找 x = 4';later(()=>{route3.style.transition='stroke-dashoffset 2.5s';route3.style.strokeDashoffset=0;dot3.style.transition='cx 1.2s linear';dot3.setAttribute('cx',270)},300);later(()=>{s3.textContent='再找 y = 3';dot3.style.transition='cy 1.1s linear';dot3.setAttribute('cy',280)},1600);later(()=>{lab3.setAttribute('opacity',1);s3.textContent='完成：A（4，3）'},2900)}const Q=[['认识坐标','哪一条轴是横向的？',['x轴','y轴','原点 O'],0],['认识坐标','原点 O 的坐标是？',['（0，0）','（1，0）','（0，1）'],0],['找出坐标','x=4，y=3，坐标是？',['（4，3）','（3，4）','（4，4）'],0],['找出坐标','x=2，y=5，坐标是？',['（5，2）','（2，5）','（2，2）'],1],['找出坐标','坐标（6，1）中，x 是？',['1','6','0'],1],['标示坐标','标示（4，3）时先找什么？',['x=4','y=3','原点后随便走'],0],['标示坐标','标示（2，5）时第二步找什么？',['x=2','y=5','x=5'],1],['标示坐标','（3，2）表示先横走几格？',['2','3','5'],1],['找出坐标','坐标（3，4）的第一个数字表示？',['x坐标','y坐标','原点'],0],['标示坐标','正确规则是？',['先 y 后 x','先 x 后 y','顺序不限'],1]];let qi=0,sc=0,ss={};function startQuiz(){qi=0;sc=0;ss={'认识坐标':[0,0],'找出坐标':[0,0],'标示坐标':[0,0]};start.style.display='none';qa.style.display='block';res.innerHTML='';render()}function render(){let q=Q[qi];prog.textContent=`第 ${qi+1}/10 题`;bar.style.width=((qi+1)*10)+'%';qbox.innerHTML=`<h2>${q[1]}</h2>`+q[2].map((o,i)=>`<button class="quizOpt" onclick="ans(${i})">${o}</button>`).join('');feed.textContent='请选择答案。'}function ans(i){let q=Q[qi];ss[q[0]][1]++;if(i==q[3]){sc++;ss[q[0]][0]++;feed.textContent='✓ 正确'}else feed.textContent='✗ 再检查：先 x，后 y。';setTimeout(()=>{qi++;qi<10?render():finish()},700)}function finish(){qa.style.display='none';let p=sc*10,level=p>=90?'已掌握':p>=70?'基本掌握，需要针对练习':'尚未掌握，需要重新学习';let weak=Object.entries(ss).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1])[0][0];res.innerHTML=`<div class="result">${sc}/10（${p}%）｜${level}</div><div class="card">认识坐标：${ss['认识坐标'][0]}/${ss['认识坐标'][1]}<br>找出坐标：${ss['找出坐标'][0]}/${ss['找出坐标'][1]}<br>标示坐标：${ss['标示坐标'][0]}/${ss['标示坐标'][1]}<br><br><b>需要加强：${weak}</b></div><button onclick="startQuiz()">重新检测</button>`;localStorage.setItem('std4_coord_last',JSON.stringify({score:sc,pct:p,skill:ss}));let all={};try{all=JSON.parse(localStorage.getItem('std4mthProgress')||'{}')}catch(e){}all.coordinates={played:true,completed:p>=90,score:p};localStorage.setItem('std4mthProgress',JSON.stringify(all))}play1();</script></body></html>
