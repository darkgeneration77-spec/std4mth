<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>魔剑学园：数学远征</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#07101b;color:#fff;font-family:system-ui,"Microsoft YaHei",sans-serif}
#load{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#173a56,#07101b 65%);z-index:20}
.box{text-align:center}.ring{width:54px;height:54px;margin:auto;border:5px solid #ffffff22;border-top-color:#65e7ff;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}small{display:block;margin-top:14px;color:#9db4c4}
iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<div id="load"><div class="box"><div class="ring"></div><small>正在载入 魔剑学园：数学远征…</small></div></div>
<iframe id="frame" allow="fullscreen"></iframe>
<script>
const parts=["data/magic/part-01.txt","data/magic/part-rest.txt"];
(async()=>{
 try{
  let s="";
  for(const p of parts){const r=await fetch(p);if(!r.ok)throw new Error(p);s+=await r.text();}
  const bin=Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0));
  const ds=new DecompressionStream("gzip");
  const txt=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
  const blob=new Blob([txt],{type:"text/html"});
  frame.src=URL.createObjectURL(blob);
  frame.onload=()=>load.remove();
 }catch(e){document.querySelector(".box").innerHTML="<h2>载入失败</h2><small>"+e.message+"</small>"}
})();
</script></body></html>
