<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔剑学园：数学远征</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101b;color:#dff9ff;font-family:system-ui,"Microsoft YaHei",sans-serif}#load{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#173a56,#07101b 65%)}.box{text-align:center}.ring{width:54px;height:54px;margin:auto;border:5px solid #ffffff22;border-top-color:#65e7ff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{display:block;margin-top:14px;color:#9db4c4}iframe{width:100%;height:100%;border:0;display:block}#homeBtn{position:fixed;z-index:9999;left:14px;top:14px;display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:12px;background:rgba(5,18,31,.82);border:1px solid rgba(113,226,255,.35);box-shadow:0 8px 24px rgba(0,0,0,.35);backdrop-filter:blur(8px);color:#e7fbff;text-decoration:none;font-size:12px;font-weight:900;letter-spacing:.3px;transition:.18s}#homeBtn:hover{transform:translateY(-2px);background:rgba(13,45,63,.92);border-color:rgba(113,226,255,.65)}@media(max-width:640px){#homeBtn{left:9px;top:9px;padding:8px 10px;font-size:11px}}</style></head><body><a id="homeBtn" href="index.html">← 回到学习中心</a><div id="load"><div class="box"><div class="ring"></div><small id="msg">正在载入课本习题版 V1.5.1…</small></div></div><iframe id="frame" allow="fullscreen"></iframe><script src="textbook-patch.js?v=20260816d"></script><script>const parts=Array.from({length:12},(_,i)=>`data/magic-v14/v14-${String(i+1).padStart(2,'0')}.txt`);(async()=>{try{let html='';for(let i=0;i<parts.length;i++){msg.textContent=`正在载入课本习题版 V1.5.1… ${i+1}/12`;const r=await fetch(parts[i]+'?v=20260816d',{cache:'no-store'});if(!r.ok)throw new Error(`资源 ${i+1}/12 载入失败 (${r.status})`);html+=await r.text()}if(!html.startsWith('<!doctype html>')||!html.includes('</body></html>'))throw new Error('原版文件拼接不完整');if(typeof applyTextbookPatch!=='function')throw new Error('课本题库补丁载入失败');html=applyTextbookPatch(html);html=html.replace(/shield:\(level>0&&i%2===0\)\|\|boss/g,'shield:true');html=html.replace('向右探索，利用平台和机关继续前进。','每只怪物都有课本数学护盾。攻击怪物 → 完成课本习题 → 破解护盾 → 才能造成伤害。');html=html.replace('READY FOR ADVENTURE','TEXTBOOK MATH ADVENTURE');frame.srcdoc=html;frame.onload=()=>load.remove()}catch(e){document.querySelector('.box').innerHTML=`<h2>Game 01 载入失败</h2><small>${e.message}</small><button onclick="location.reload()" style="margin-top:18px;padding:10px 16px;border:0;border-radius:10px;background:#62dcff;font-weight:900">重新载入</button>`}})();</script></body></html>
