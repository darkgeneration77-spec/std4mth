<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔剑学园：数学远征</title><style>html,body{margin:0;width:100%;height:100%;background:#07101b;color:#fff;font-family:system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}#load{position:fixed;inset:0;display:grid;place-items:center;background:#07101b;z-index:9}.box{text-align:center}.ring{width:52px;height:52px;margin:auto;border:5px solid #ffffff22;border-top-color:#65e7ff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{display:block;margin-top:14px;color:#9db4c4}iframe{width:100%;height:100%;border:0}button{position:fixed;left:12px;bottom:12px;z-index:20;padding:10px 14px;border-radius:10px;border:1px solid #8cecff55;background:#071827dd;color:white;font-weight:800}</style></head><body><div id="load"><div class="box"><div class="ring"></div><small id="msg">正在载入 Game 01…</small></div></div><button onclick="location.href='index.html'">← 返回游戏中心</button><iframe id="frame" allow="fullscreen"></iframe><script>const parts=Array.from({length:9},(_,i)=>`data/magic/part-${String(i+1).padStart(2,'0')}.txt`);(async()=>{try{let s='';for(let i=0;i<parts.length;i++){msg.textContent=`正在载入 Game 01… ${i+1}/9`;let r=await fetch(parts[i]+'?v=3',{cache:'no-store'});if(!r.ok)throw Error('资源 '+(i+1)+' 读取失败');s+=(await r.text()).replace(/\s/g,'')}if(!/^[A-Za-z0-9+/]*={0,2}$/.test(s)||s.length%4)throw Error('游戏数据格式错误');const bin=Uint8Array.from(atob(s),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw Error('浏览器不支持游戏解压，请使用最新版 Chrome/Edge');const ds=new DecompressionStream('gzip');const txt=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();frame.srcdoc=txt;frame.onload=()=>load.remove()}catch(e){document.querySelector('.box').innerHTML='<h2>Game 01 载入失败</h2><small>'+e.message+'</small><p><button style="position:static;margin-top:16px" onclick="location.reload()">重新载入</button></p>'}})();</script></body></html>
