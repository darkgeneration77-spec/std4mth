<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>魔剑学园：数学远征</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Microsoft YaHei";background:#07121e;color:#fff}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#hud{position:fixed;z-index:5;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.p{background:#071522cc;border:1px solid #77dfff44;border-radius:14px;padding:8px 12px;box-shadow:0 8px 30px #0007}.small{font-size:10px;color:#90aabd;letter-spacing:1px}.v{font-weight:900}.bar{width:150px;height:8px;background:#1e2a35;border-radius:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ff4c64,#ffb14b)}#mission{position:fixed;z-index:5;top:75px;left:50%;transform:translateX(-50%);background:#071522bb;border:1px solid #77dfff33;border-radius:12px;padding:7px 12px;font-size:12px;font-weight:800}#ctrl{position:fixed;z-index:8;left:12px;right:12px;bottom:14px;display:flex;justify-content:space-between;align-items:end}.grp{display:flex;gap:8px}.b{width:58px;height:58px;border:0;border-radius:17px;background:#edfaffee;color:#17435c;font-size:22px;font-weight:1000;box-shadow:0 6px 0 #658ca0;touch-action:none}.b:active{transform:translateY(4px);box-shadow:0 2px 0 #658ca0}.atk{width:78px;background:#ffd85a;color:#724600;box-shadow:0 6px 0 #ad7114}.sk{background:#c8b0ff;color:#43267f}.hub{position:fixed;z-index:20;left:12px;bottom:86px;color:#dff9ff;text-decoration:none;background:#071522dd;border:1px solid #77dfff44;padding:8px 11px;border-radius:10px;font-size:11px;font-weight:800}.modal{position:fixed;z-index:30;inset:0;display:none;place-items:center;background:#03101dcc;backdrop-filter:blur(7px)}.modal.on{display:grid}.card{width:min(560px,92vw);background:linear-gradient(#102a3d,#071522);border:1px solid #75e8ff55;border-radius:22px;padding:22px;text-align:center;box-shadow:0 25px 80px #0009}.rune{width:115px;height:115px;border:2px solid #63e9ff88;border-radius:50%;margin:0 auto 10px;box-shadow:0 0 30px #63e9ff33,inset 0 0 25px #716dff22;display:grid;place-items:center;font-size:40px;animation:s 8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.q{font-size:20px;font-weight:900;margin:10px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.o{padding:12px;border-radius:12px;border:1px solid #70e8ff44;background:#153149;color:#fff;font-size:16px;font-weight:900}.o.good{background:#18553c}.o.bad{background:#6b2631}.primary{margin-top:13px;padding:12px 22px;border:0;border-radius:12px;background:#ffd45b;color:#704500;font-weight:1000}@media(max-width:650px){.bar{width:90px}#mission{top:68px}.b{width:52px;height:52px}.atk{width:68px}.p{padding:6px 8px}}</style></head><body><canvas id="c"></canvas><div id="hud"><div class="p"><div class="small">HP</div><div class="bar"><div id="hp" class="fill"></div></div></div><div class="p"><div class="small">LEVEL</div><div class="v" id="lv">森林世界 · 1</div></div><div class="p"><div class="small">COINS / SKILL</div><div class="v"><span id="coin">0</span> 🪙 · <span id="sp">0</span> ✦</div></div></div><div id="mission">向右探索，击败怪物。蓝色护盾必须答题破解。</div><a class="hub" href="index.html">← 返回游戏中心</a><div id="ctrl"><div class="grp"><button class="b" id="L">◀</button><button class="b" id="R">▶</button><button class="b" id="J">▲</button></div><div class="grp"><button class="b sk" id="S">✦</button><button class="b atk" id="A">⚔</button></div></div><div id="quiz" class="modal"><div class="card"><div class="rune">✦</div><div class="small">MATH SHIELD BREAK</div><div id="q" class="q"></div><div id="opts" class="opts"></div><div id="fb"></div></div></div><div id="clear" class="modal"><div class="card"><div style="font-size:42px">★★★</div><h2>森林世界完成</h2><p>答对题目获得技能点，下一版继续进入魔法遗迹与熔岩王城。</p><button class="primary" onclick="finish()">完成挑战</button></div></div><script>const cv=c,ctx=cv.getContext('2d'),$=x=>document.getElementById(x);let W,H,gY,cam=0,world=2600,paused=0,coins=0,skill=0,kills=0;let k={l:0,r:0,j:0},p={x:80,y:0,w:54,h:72,vx:0,vy:0,hp:100,on:0,face:1,cd:0,scd:0,inv:0};let es=[mk(430,0),mk(780,1),mk(1180,2),mk(1600,1),mk(2040,2),mk(2360,3)],shots=[],fx=[];function mk(x,t){return{x,t,y:0,w:t===3?90:62,h:t===3?90:62,hp:t===3?10:3,max:t===3?10:3,shield:t>0,dead:0,cd:40+Math.random()*70,dir:-1}}function rs(){W=innerWidth;H=innerHeight;cv.width=W*devicePixelRatio;cv.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);gY=H*.79;p.y=Math.min(p.y,gY-p.h);es.forEach(e=>e.y=gY-e.h)}addEventListener('resize',rs);rs();function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function upd(){hp.style.width=Math.max(0,p.hp)+'%';coin.textContent=coins;sp.textContent=skill}function hurt(n){if(p.inv)return;p.hp-=n;p.inv=45;if(p.hp<=0){p.hp=100;p.x=Math.max(60,p.x-300)}upd()}function hit(e,n){e.hp-=n;e.x+=p.face*18;for(let i=0;i<8;i++)fx.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5-2,l:25});if(e.hp<=0){e.dead=1;kills++;coins+=20;skill++;upd();if(es.every(x=>x.dead)){mission.textContent='传送门已开启！继续向最右边前进。'}}}function attack(){if(paused||p.cd)return;p.cd=16;let b={x:p.face>0?p.x+p.w:p.x-55,y:p.y+8,w:55,h:62};for(const e of es)if(!e.dead&&rect(b,e)){if(e.shield)return quiz(e);hit(e,1)}}function blast(){if(paused||p.scd)return;p.scd=70;shots.push({x:p.x+p.w/2,y:p.y+28,vx:p.face*9,l:100})}function quiz(e){paused=1;let a=3+Math.floor(Math.random()*8),b=2+Math.floor(Math.random()*7),ans=a*b;q.innerHTML=`长 ${a} cm × 宽 ${b} cm<br>面积 = ?`;let s=new Set([ans]);while(s.size<4)s.add(Math.max(1,ans+Math.floor(Math.random()*17)-8));opts.innerHTML=[...s].sort(()=>Math.random()-.5).map(v=>`<button class="o" data-v="${v}">${v} cm²</button>`).join('');fb.textContent='';opts.querySelectorAll('.o').forEach(x=>x.onclick=()=>{if(+x.dataset.v===ans){x.classList.add('good');e.shield=0;skill++;coins+=10;upd();fb.textContent='护盾破解！✦ +1';setTimeout(()=>{quiz.classList.remove('on');paused=0},550)}else{x.classList.add('bad');fb.textContent='再试一次'}});quiz.classList.add('on')}function bg(){let gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#5fc9df');gr.addColorStop(.55,'#8fd5ba');gr.addColorStop(1,'#17372b');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);ctx.fillStyle='#dff5dd66';for(let x=-cam*.15%300-300;x<W+300;x+=300){ctx.beginPath();ctx.moveTo(x,H*.58);ctx.lineTo(x+170,H*.25);ctx.lineTo(x+340,H*.58);ctx.fill()}ctx.fillStyle='#183f2d';for(let x=-cam*.35%230-230;x<W+230;x+=230){ctx.beginPath();ctx.arc(x,H*.58,90,Math.PI,0);ctx.fill()}ctx.fillStyle='#244f32';ctx.fillRect(0,gY,W,H-gY)}function hero(){let x=p.x-cam,y=p.y;ctx.save();ctx.translate(x+p.w/2,y+p.h/2);if(p.face<0)ctx.scale(-1,1);ctx.rotate(!p.on?p.vy*.002:0);ctx.fillStyle='#dcecff';ctx.beginPath();ctx.arc(0,-23,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#2c3158';ctx.fillRect(-16,-8,32,40);ctx.fillStyle='#713cff';ctx.fillRect(-12,2,24,7);ctx.strokeStyle='#70efff';ctx.lineWidth=6;ctx.shadowColor='#70efff';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(14,-3);ctx.lineTo(38,-30);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#1b2035';ctx.fillRect(-15,30,11,20);ctx.fillRect(5,30,11,20);ctx.restore()}function enemy(e){let x=e.x-cam,y=e.y;if(e.t===0){ctx.fillStyle='#71d75e';ctx.beginPath();ctx.ellipse(x+31,y+38,29,25,0,0,Math.PI*2);ctx.fill()}else if(e.t===1){ctx.fillStyle='#6faf51';ctx.beginPath();ctx.arc(x+31,y+31,25,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4b2f76';ctx.fillRect(x+15,y+50,32,12)}else{ctx.fillStyle=e.t===3?'#3b2730':'#394c58';ctx.fillRect(x+8,y+8,e.w-16,e.h-8);ctx.fillStyle='#ff623c';ctx.fillRect(x+18,y+22,e.w-36,7)}ctx.fillStyle='#122018';ctx.fillRect(x,y-8,e.w,5);ctx.fillStyle=e.t===3?'#ff9a44':'#71df6b';ctx.fillRect(x,y-8,e.w*e.hp/e.max,5);if(e.shield){ctx.strokeStyle='#69eaff';ctx.lineWidth=3;ctx.shadowColor='#69eaff';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(x+e.w/2,y+e.h/2,e.w*.55,0,7);ctx.stroke();ctx.shadowBlur=0}}function tick(){bg();if(!paused){p.vx=0;if(k.l)p.vx=-4.4,p.face=-1;if(k.r)p.vx=4.4,p.face=1;if(k.j&&p.on)p.vy=-10.5,p.on=0;p.vy+=.55;p.x+=p.vx;p.y+=p.vy;p.x=Math.max(0,Math.min(world-p.w,p.x));if(p.y>=gY-p.h)p.y=gY-p.h,p.vy=0,p.on=1;if(p.cd)p.cd--;if(p.scd)p.scd--;if(p.inv)p.inv--;cam=Math.max(0,Math.min(world-W,p.x-W*.32));for(const e of es){if(e.dead)continue;let d=p.x-e.x;e.dir=d>0?1:-1;e.cd--;if(Math.abs(d)<350)e.x+=e.dir*(e.t===3?1:.55);if(e.cd<=0&&Math.abs(d)<240){if(e.t>=2)shots.push({x:e.x+e.w/2,y:e.y+25,vx:e.dir*4,l:110,enemy:1});else e.x+=e.dir*35;e.cd=65}if(rect(p,e))hurt(e.t===3?18:10)}for(const s of shots){s.x+=s.vx;s.l--;if(s.enemy){if(rect(p,{x:s.x,y:s.y,w:13,h:13}))s.l=0,hurt(12)}else for(const e of es)if(!e.dead&&rect({x:s.x,y:s.y,w:18,h:12},e)){s.l=0;e.shield?quiz(e):hit(e,2)}}shots=shots.filter(s=>s.l>0);for(const f of fx){f.x+=f.vx;f.y+=f.vy;f.vy+=.14;f.l--}fx=fx.filter(f=>f.l>0);if(es.every(x=>x.dead)&&p.x>world-120){paused=1;clear.classList.add('on')}}for(const e of es)if(!e.dead)enemy(e);for(const s of shots){ctx.fillStyle=s.enemy?'#ff694d':'#75edff';ctx.beginPath();ctx.arc(s.x-cam,s.y,7,0,7);ctx.fill()}for(const f of fx){ctx.fillStyle='#ffe76c';ctx.beginPath();ctx.arc(f.x-cam,f.y,3,0,7);ctx.fill()}hero();requestAnimationFrame(tick)}function bind(id,key){let z=$(id);z.onpointerdown=e=>{e.preventDefault();k[key]=1};['pointerup','pointercancel','pointerleave'].forEach(a=>z.addEventListener(a,e=>{e.preventDefault();k[key]=0}))}bind('L','l');bind('R','r');bind('J','j');A.onpointerdown=e=>{e.preventDefault();attack()};S.onpointerdown=e=>{e.preventDefault();blast()};addEventListener('keydown',e=>{if(['a','ArrowLeft'].includes(e.key))k.l=1;if(['d','ArrowRight'].includes(e.key))k.r=1;if(['w','ArrowUp',' '].includes(e.key))k.j=1;if(e.key==='j')attack();if(e.key==='k')blast()});addEventListener('keyup',e=>{if(['a','ArrowLeft'].includes(e.key))k.l=0;if(['d','ArrowRight'].includes(e.key))k.r=0;if(['w','ArrowUp',' '].includes(e.key))k.j=0});function finish(){let d={};try{d=JSON.parse(localStorage.std4mthProgress||'{}')}catch(e){}d.magic={played:true,completed:true,completedAt:Date.now()};localStorage.std4mthProgress=JSON.stringify(d);location.href='index.html'}upd();tick()</script></body></html>
