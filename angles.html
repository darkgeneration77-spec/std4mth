<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角度忍者：忍界试炼</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#07101b;color:#fff;font-family:system-ui,"Microsoft YaHei",sans-serif;overflow:hidden}#load{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#173a56,#07101b 65%);z-index:50}.box{text-align:center}.ring{width:54px;height:54px;margin:auto;border:5px solid #ffffff22;border-top-color:#65e7ff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{display:block;margin-top:14px;color:#9db4c4}iframe{width:100%;height:100%;border:0;display:block}#hubBtn{position:fixed;z-index:80;left:14px;bottom:14px;border:1px solid #8cecff55;background:rgba(5,20,34,.86);color:#eaffff;padding:10px 14px;border-radius:12px;font-weight:900;backdrop-filter:blur(10px);box-shadow:0 8px 25px #0006;cursor:pointer}#status{position:fixed;z-index:80;right:14px;bottom:14px;padding:9px 12px;border-radius:12px;background:rgba(5,20,34,.78);border:1px solid #ffffff18;color:#9fc4d6;font-size:11px;letter-spacing:1px}#status.done{color:#baffd2;border-color:#70e6a055;background:rgba(16,58,42,.78)}</style></head><body><div id="load"><div class="box"><div class="ring"></div><small>正在载入 角度忍者：忍界试炼…</small></div></div><button id="hubBtn" onclick="location.href='index.html'">← 返回游戏中心</button><div id="status">已记录游玩</div><iframe id="frame" allow="fullscreen"></iframe><script>const GAME_KEY='angles',parts=['data/angles/part-01.txt'];function readProgress(){try{return JSON.parse(localStorage.getItem('std4mthProgress')||'{}')}catch(e){return {}}}function writeProgress(p){localStorage.setItem('std4mthProgress',JSON.stringify(p))}function markPlayed(){let p=readProgress();p[GAME_KEY]=Object.assign({},p[GAME_KEY],{played:true,lastPlayed:Date.now()});writeProgress(p)}function markComplete(){let p=readProgress();p[GAME_KEY]=Object.assign({},p[GAME_KEY],{played:true,completed:true,completedAt:p[GAME_KEY]?.completedAt||Date.now(),lastPlayed:Date.now()});writeProgress(p);status.textContent='✓ 已完成';status.classList.add('done')}function isComplete(d){try{const el=d.getElementById('endOverlay');return !!(el&&!el.classList.contains('hidden')&&/MISSION REPORT|任务完成/.test(el.textContent))}catch(e){return false}}markPlayed();(async()=>{try{let s='';for(const p of parts){const r=await fetch(p);if(!r.ok)throw new Error(p);s+=await r.text()}const bin=Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const txt=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();frame.src=URL.createObjectURL(new Blob([txt],{type:'text/html'}));frame.onload=()=>{load.remove();let tries=0;const poll=setInterval(()=>{tries++;try{const d=frame.contentDocument;if(d&&isComplete(d)){markComplete();clearInterval(poll)}}catch(e){}if(tries>7200)clearInterval(poll)},500)}}catch(e){document.querySelector('.box').innerHTML='<h2>载入失败</h2><small>'+e.message+'</small>'}})();const pg=readProgress();if(pg[GAME_KEY]?.completed){status.textContent='✓ 已完成';status.classList.add('done')}</script></body></html>
